version: "3.9"

services:
  # ── PostgreSQL + PostGIS ──────────────────────────────────────────────────────
  db:
    image: postgis/postgis:15-3.4
    container_name: krishilink_db
    environment:
      POSTGRES_DB: krishilink_dev
      POSTGRES_USER: krishilink
      POSTGRES_PASSWORD: krishilink
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U krishilink -d krishilink_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ─────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: krishilink_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Django backend ────────────────────────────────────────────────────────────
  backend:
    build:
      context: ../backend
      dockerfile: ../docker/Dockerfile.backend
    container_name: krishilink_backend
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn krishilink.wsgi:application --bind 0.0.0.0:8000 --workers 2"
    volumes:
      - ../backend:/app
    ports:
      - "8000:8000"
    environment:
      DJANGO_SETTINGS_MODULE: krishilink.settings.development
      DATABASE_URL: postgres://krishilink:krishilink@db:5432/krishilink_dev
      CELERY_BROKER_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-dev-docker-secret-key}
      DEBUG: ${DEBUG:-True}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      IBM_WATSONX_URL: ${IBM_WATSONX_URL:-}
      IBM_WATSONX_API_KEY: ${IBM_WATSONX_API_KEY:-}
      IBM_WATSONX_PROJECT_ID: ${IBM_WATSONX_PROJECT_ID:-}
      IBM_GRANITE_MODEL_ID: ${IBM_GRANITE_MODEL_ID:-ibm/granite-13b-instruct-v2}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Celery worker ─────────────────────────────────────────────────────────────
  celery_worker:
    build:
      context: ../backend
      dockerfile: ../docker/Dockerfile.backend
    container_name: krishilink_celery
    command: celery -A krishilink worker --loglevel=info
    volumes:
      - ../backend:/app
    environment:
      DJANGO_SETTINGS_MODULE: krishilink.settings.development
      DATABASE_URL: postgres://krishilink:krishilink@db:5432/krishilink_dev
      CELERY_BROKER_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-dev-docker-secret-key}
      IBM_WATSONX_API_KEY: ${IBM_WATSONX_API_KEY:-}
      IBM_WATSONX_PROJECT_ID: ${IBM_WATSONX_PROJECT_ID:-}
    depends_on:
      - backend
      - redis

  # ── Celery beat (scheduler) ───────────────────────────────────────────────────
  celery_beat:
    build:
      context: ../backend
      dockerfile: ../docker/Dockerfile.backend
    container_name: krishilink_celery_beat
    command: celery -A krishilink beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    volumes:
      - ../backend:/app
    environment:
      DJANGO_SETTINGS_MODULE: krishilink.settings.development
      DATABASE_URL: postgres://krishilink:krishilink@db:5432/krishilink_dev
      CELERY_BROKER_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-dev-docker-secret-key}
    depends_on:
      - backend
      - redis

  # ── React frontend ─────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ../frontend
      dockerfile: ../docker/Dockerfile.frontend
    container_name: krishilink_frontend
    ports:
      - "5173:5173"
    volumes:
      - ../frontend:/app
      - /app/node_modules
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api/v1

volumes:
  postgres_data:
